
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Temperatura</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor">
        <h1>Convertidor de Temperatura</h1>

        <label>Temperatura:</label>
        <input type="number" id="temperatura" placeholder="Escribe un valor">

        <label>Convertir de:</label>
        <select id="origen">
            <option value="">Selecciona una unidad</option>
            <option value="C">Celsius</option>
            <option value="F">Fahrenheit</option>
            <option value="K">Kelvin</option>
        </select>

        <label>Convertir a:</label>
        <select id="destino">
            <option value="">Selecciona una unidad</option>
            <option value="C">Celsius</option>
            <option value="F">Fahrenheit</option>
            <option value="K">Kelvin</option>
        </select>

        <button id="convertir" disabled>Convertir</button>

        <h2 id="resultado"></h2>
        <p id="mensaje"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
